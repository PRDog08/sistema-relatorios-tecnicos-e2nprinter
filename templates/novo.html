{% extends "base.html" %}

{% block conteudo %}
<section class="card">
    <div class="cabecalho-painel">
        <div>
            <h2>Novo relatorio tecnico</h2>
            <p>Preencha os dados do atendimento tecnico.</p>
        </div>

        <a class="botao-secundario" href="{{ url_for('admin') }}">Voltar</a>
    </div>

    <form action="{{ url_for('criar_relatorio') }}" method="POST" class="formulario">
        <div class="form-section">
            <h3>Dados do cliente</h3>
            <div class="grid">
                <label>
                    Cliente *
                    <input type="text" name="cliente" required>
                </label>
                <label>
                    Responsavel
                    <input type="text" name="responsavel">
                </label>
                <label>
                    Telefone *
                    <input type="text" name="telefone" inputmode="numeric" pattern="[0-9]{10,11}" maxlength="11" required>
                </label>
                <label>
                    CEP
                    <input type="text" name="cep" inputmode="numeric" pattern="[0-9]{8}" maxlength="8">
                </label>
            </div>
        </div>

        <div class="form-section">
            <h3>Endereco</h3>
            <div class="grid">
                <label class="campo-largo">
                    Endereco
                    <input type="text" name="endereco">
                </label>
                <label>
                    Cidade
                    <input type="text" name="cidade">
                </label>
                <label>
                    Bairro
                    <input type="text" name="bairro">
                </label>
                <label>
                    UF
                    <input type="text" name="uf" maxlength="2" placeholder="SP">
                </label>
            </div>
        </div>

        <div class="form-section">
            <h3>Equipamento</h3>
            <div class="grid">
                <label>
                    Marca
                    <input type="text" name="marca" value="Konica Minolta">
                </label>
                <label>
                    Equipamento / modelo *
                    <select name="equipamento" required>
                        <option value="">Selecione o modelo atendido</option>

                        <optgroup label="Linha Office - A3 Coloridas">
                            <option>Bizhub C200</option>
                            <option>Bizhub C203</option>
                            <option>Bizhub C220</option>
                            <option>Bizhub C221</option>
                            <option>Bizhub C224</option>
                            <option>Bizhub C224e</option>
                            <option>Bizhub C227</option>
                            <option>Bizhub C250</option>
                            <option>Bizhub C250i</option>
                            <option>Bizhub C251i</option>
                            <option>Bizhub C253</option>
                            <option>Bizhub C258</option>
                            <option>Bizhub C280</option>
                            <option>Bizhub C281</option>
                            <option>Bizhub C284</option>
                            <option>Bizhub C284e</option>
                            <option>Bizhub C287</option>
                            <option>Bizhub C300i</option>
                            <option>Bizhub C301i</option>
                            <option>Bizhub C308</option>
                            <option>Bizhub C353</option>
                            <option>Bizhub C360</option>
                            <option>Bizhub C360i</option>
                            <option>Bizhub C361i</option>
                            <option>Bizhub C364</option>
                            <option>Bizhub C364e</option>
                            <option>Bizhub C368</option>
                            <option>Bizhub C450i</option>
                            <option>Bizhub C451i</option>
                            <option>Bizhub C454</option>
                            <option>Bizhub C454e</option>
                            <option>Bizhub C458</option>
                            <option>Bizhub C550i</option>
                            <option>Bizhub C551i</option>
                            <option>Bizhub C554</option>
                            <option>Bizhub C554e</option>
                            <option>Bizhub C558</option>
                            <option>Bizhub C650i</option>
                            <option>Bizhub C651i</option>
                            <option>Bizhub C654</option>
                            <option>Bizhub C654e</option>
                            <option>Bizhub C658</option>
                            <option>Bizhub C659</option>
                            <option>Bizhub C750i</option>
                            <option>Bizhub C754</option>
                            <option>Bizhub C754e</option>
                            <option>Bizhub C759</option>
                        </optgroup>

                        <optgroup label="Linha Office - A4 Coloridas">
                            <option>Bizhub C10</option>
                            <option>Bizhub C20</option>
                            <option>Bizhub C25</option>
                            <option>Bizhub C30P</option>
                            <option>Bizhub C31P</option>
                            <option>Bizhub C35</option>
                            <option>Bizhub C35P</option>
                            <option>Bizhub C3100P</option>
                            <option>Bizhub C3110</option>
                            <option>Bizhub C3300i</option>
                            <option>Bizhub C3320i</option>
                            <option>Bizhub C3350</option>
                            <option>Bizhub C3350i</option>
                            <option>Bizhub C3351</option>

                            <option>Bizhub PRESS C7000P</option>
                            <option>Bizhub PRESS C1060</option>
                            <option>Bizhub PRESS C1070</option>
                            <option>Bizhub PRESS C1070P</option>
                            <option>Bizhub PRESS C1085</option>
                            <option>Bizhub PRESS C1100</option>
                        </optgroup>

                        <optgroup label="Linha Pro - Accurio">
                            <option>AccurioPrint C2060L</option>
                            <option>AccurioPrint C3070L</option>
                            <option>AccurioPrint C4065</option>
                            <option>AccurioPress C2060</option>
                            <option>AccurioPress C2070</option>
                            <option>AccurioPress C2070P</option>

                            <option>AccurioPress C6100</option>
                            <option>AccurioPress C7090</option>
                            <option>AccurioPress C7100</option>
                            <option>AccurioPress C12000</option>
                            <option>AccurioPress C14000</option>
                        </optgroup>
                    </select>
                </label>
                <label>
                    Numero de serie
                    <input type="text" name="numero_serie">
                </label>
                <label>
                    Contador geral
                    <input type="text" name="contador_geral">
                </label>
            </div>
        </div>

        <div class="form-section">
            <h3>Atendimento tecnico</h3>
            <div class="grid">
                <label>
                    Hora inicial
                    <input type="time" name="hora_inicio">
                </label>
                <label>
                    Hora final
                    <input type="time" name="hora_fim">
                </label>
                <label class="campo-largo">
                    Defeito relatado
                    <textarea name="defeito_relatado"></textarea>
                </label>
                <label class="campo-largo">
                    Diagnostico
                    <textarea name="diagnostico"></textarea>
                </label>
                <label class="campo-largo">
                    Servico executado
                    <textarea name="servico_executado"></textarea>
                </label>
                <label class="campo-largo">
                    Pecas
                    <textarea name="pecas"></textarea>
                </label>
            </div>
        </div>

        <div class="form-section">
            <h3>Conclusao</h3>
            <div class="grid">
                <label>
                    Status
                    <select name="status">
                        <option value="Concluido">Concluido</option>
                        <option value="Pendente">Pendente</option>
                        <option value="Aguardando peca">Aguardando peca</option>
                        <option value="Retorno necessario">Retorno necessario</option>
                    </select>
                </label>
                <label>
                    Tecnico
                    <input type="text" name="tecnico">
                </label>
                <label class="campo-largo">
                    Observacoes finais
                    <textarea name="observacoes"></textarea>
                </label>
            </div>
        </div>

        <div class="form-actions">
            <button type="submit">Salvar relatorio</button>
        </div>
    </form>
</section>
{% endblock %}
