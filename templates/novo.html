{% extends "base.html" %}

{% block conteudo %}

<section class="card">

    <div class="cabecalho-painel">
        <div>
            <h2>Editar relatório técnico</h2>
            <p>Atualize os dados do atendimento técnico.</p>
        </div>

        <a class="botao-secundario"
           href="{{ url_for('index') }}">
            Voltar ao painel
        </a>
    </div>

    <form action="{{ url_for('editar_relatorio') }}" method="POST">

        <!-- ========================= -->
        <!-- DADOS DO CLIENTE -->
        <!-- ========================= -->

        <div class="form-section">
            <h3>Dados do cliente</h3>

            <div class="grid">

                <label>
                    Cliente *
                    <input type="text" name="cliente" required value="{{ relatorio.get('cliente','') }}">
                </label>

                <label>
                    Responsável
                    <input type="text" name="responsavel" value="{{ relatorio.get('responsavel','') }}">
                </label>

                <label>
                    Telefone
                    <input type="text"
                           name="telefone"
                           inputmode="numeric"
                           pattern="[0-9]*"
                           maxlength="11"
                           class="somente-numeros"
                           placeholder="Somente números"
                           value="{{ relatorio.get('telefone','') }}">
                </label>

                <label>
                    CEP
                    <input type="text"
                           name="cep"
                           inputmode="numeric"
                           pattern="[0-9]*"
                           maxlength="8"
                           class="somente-numeros"
                           placeholder="Somente números"
                           value="{{ relatorio.get('cep','') }}">
                </label>

            </div>
        </div>

        <!-- ========================= -->
        <!-- ENDEREÇO -->
        <!-- ========================= -->

        <div class="form-section">
            <h3>Endereço</h3>

            <div class="grid">

                <label class="campo-largo">
                    Endereço
                    <input type="text" name="endereco" value="{{ relatorio.get('endereco','') }}">
                </label>

                <label>
                    Cidade
                    <input type="text" name="cidade" value="{{ relatorio.get('cidade','') }}">
                </label>

                <label>
                    Bairro
                    <input type="text" name="bairro" value="{{ relatorio.get('bairro','') }}">
                </label>

                <label>
                    UF
                    <input type="text" name="uf" maxlength="2" placeholder="SP"
                           value="{{ relatorio.get('uf','') }}">
                </label>

            </div>
        </div>

        <!-- EQUIPAMENTO -->
        <!-- ========================= -->

                <label>
                    Número de série
                    <input type="text" name="numero_serie" value="{{ relatorio.get('numero_serie','') }}">
                </label>

                <label>
                    Contador geral
                    <input type="text" name="contador_geral" value="{{ relatorio.get('contador_geral','') }}">
                </label>

            </div>
        </div>

        <!-- ========================= -->
        <!-- ATENDIMENTO -->
        <!-- ========================= -->

        <div class="form-section">

            <h3>Atendimento técnico</h3>

            <div class="grid">

                <label>
                    Hora inicial
                    <input type="time" name="hora_inicio" value="{{ relatorio.get('hora_inicio','') }}">
                </label>

                <label>
                    Hora final
                    <input type="time" name="hora_fim" value="{{ relatorio.get('hora_fim','') }}">
                </label>

                <label class="campo-largo">
                    Defeito relatado *
                    <textarea name="defeito_relatado" required>{{ relatorio.get('defeito_relatado','') }}</textarea>
                </label>

                <label class="campo-largo">
                    Diagnóstico *
                    <textarea name="diagnostico" required>{{ relatorio.get('diagnostico','') }}</textarea>
                </label>

                <label class="campo-largo">
                    Serviço executado *
                    <textarea name="servico_executado" required>{{ relatorio.get('servico_executado','') }}</textarea>
                </label>

                <label class="campo-largo">
                    Peças
                    <textarea name="pecas">{{ relatorio.get('pecas','') }}</textarea>
                </label>

            </div>
        </div>

        <!-- ========================= -->
        <!-- CONCLUSÃO -->
        <!-- ========================= -->

        <div class="form-section">

            <h3>Conclusão</h3>

            <div class="grid">

                <label>
                    Status *
                    <select name="status" required>
                        <option value="Concluído" {% if relatorio.get("status") == "Concluído" %}selected{% endif %}>Concluído</option>
                        <option value="Pendente" {% if relatorio.get("status") == "Pendente" %}selected{% endif %}>Pendente</option>
                        <option value="Aguardando peça" {% if relatorio.get("status") == "Aguardando peça" %}selected{% endif %}>Aguardando peça</option>
                        <option value="Retorno necessário" {% if relatorio.get("status") == "Retorno necessário" %}selected{% endif %}>Retorno necessário</option>
                    </select>
                </label>

                <label>
                    Técnico *
                    <input type="text" name="tecnico" value="{{ relatorio.get('tecnico','') }}" required>
                </label>

                <label class="campo-largo">
                    Observações finais
                    <textarea name="observacoes">{{ relatorio.get('observacoes','') }}</textarea>
                </label>

            </div>
        </div>

        <div class="form-actions">
            <button type="submit">Salvar alterações</button>
        </div>

    </form>
</section>

<script>
    document.querySelectorAll(".somente-numeros").forEach((campo) => {
        campo.addEventListener("input", () => {
            campo.value = campo.value.replace(/\D/g, "");
        });
    });

    const selectModelo = document.querySelector('select[name="equipamento"]');

    if (selectModelo) {
        const modeloAtual = selectModelo.dataset.modeloAtual;

        if (modeloAtual) {
            const existeNaLista = Array.from(selectModelo.options)
                .some(option => option.value === modeloAtual);

            if (existeNaLista) {
                selectModelo.value = modeloAtual;
            } else {
                const optionAtual = document.createElement("option");
                optionAtual.value = modeloAtual;
                optionAtual.textContent = "Modelo atual não listado: " + modeloAtual;
                optionAtual.selected = true;

                selectModelo.insertBefore(optionAtual, selectModelo.children[1]);
            }
        }
    }
</script>

{% endblock %}
