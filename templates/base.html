<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>{{ system_name }}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Sistema de Relatorios Tecnicos da E2nPrinter">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <header class="topo">
        <div class="topo-marca">
            <img
                class="topo-logo"
                src="{{ url_for('static', filename='logo-e2nprinter-white.svg') }}"
                alt="Logo E2nPrinter"
            >
        </div>

        <nav>
            <a href="{{ url_for('admin') }}">Inicio</a>
            <a href="{{ url_for('novo_relatorio') }}">Novo relatorio</a>
            <a href="{{ url_for('logout') }}">Sair</a>
        </nav>
    </header>

    <main class="container">
        {% block conteudo %}{% endblock %}
    </main>
</body>
</html>
