<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>{{ system_name }}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Sistema de Relatorios Tecnicos da E2nPrinter">
    <meta name="theme-color" content="#15191c">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="E2nPrinter">
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='favicon.svg', v='1') }}">
    <link rel="icon" type="image/png" sizes="16x16" href="{{ url_for('static', filename='favicon-16.png', v='1') }}">
    <link rel="icon" type="image/png" sizes="32x32" href="{{ url_for('static', filename='favicon-32.png', v='1') }}">
    <link rel="icon" type="image/png" sizes="48x48" href="{{ url_for('static', filename='favicon-48.png', v='1') }}">
    <link rel="shortcut icon" href="{{ url_for('static', filename='favicon.ico', v='1') }}">
    <link rel="apple-touch-icon" sizes="180x180" href="{{ url_for('static', filename='apple-touch-icon.png', v='1') }}">
    <link rel="manifest" href="{{ url_for('static', filename='site.webmanifest', v='1') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <header class="topo">
        <div class="topo-marca">
            <img
                class="topo-logo"
                src="{{ url_for('static', filename='logo-e2nprinter-white.svg') }}"
                alt="Logo E2nPrinter"
            >
        </div>

        <nav>
            <a href="{{ url_for('admin') }}">Inicio</a>
            <a href="{{ url_for('novo_relatorio') }}">Novo relatorio</a>
            <a href="{{ url_for('listar_clientes') }}">Clientes</a>
            <a href="{{ url_for('logout') }}">Sair</a>
        </nav>
    </header>

    <main class="container">
        {% block conteudo %}{% endblock %}
    </main>
    <script src="{{ url_for('static', filename='cep.js') }}"></script>
</body>
</html>
